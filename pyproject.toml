[project]
name = "cours-agentique-teluq"
version = "0.1.0"
description = "C1 — IA agentique : fondements, conception et développement (TÉLUQ)"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.111.0",
    "marimo>=0.25.2",
    "numpy>=2.5.4",
    "openai>=3.37.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["c1"]
