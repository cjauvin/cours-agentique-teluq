project:
  type: book
  output-dir: _site
  # Les laboratoires sans PyTorch, en version navigateur : _site/labos/*.html.
  post-render: uv run python outils/exporter_labos_web.py
  render:
    - "*.qmd"
    - "modules/**/*.qmd"

lang: fr
language:
  title-block-author-single: "Professeur"
  title-block-author-plural: "Professeurs"

book:
  title: "IA agentique"
  subtitle: "Fondements, conception et développement"
  author:
    name: "Christian Jauvin"
    url: "https://www.teluq.ca/communaute/corps-professoral/cjauvin"
  favicon: images/logo.svg
  site-url: https://cjauvin.github.io/cours-agentique-teluq/
  # Pas de raccourcis clavier (« f », « s », « / ») : Quarto ne voit pas les
  # champs des îles marimo (shadow DOM), et y taper ouvrait la recherche.
  search:
    keyboard-shortcut: []
  page-navigation: true
  sidebar:
    style: docked
    logo: images/logo.svg
    collapse-level: 1
  chapters:
    - index.qmd
    - mise-en-route.qmd
    - part: "Module 1 — Prédire"
      chapters:
        - modules/1-predire/s01.qmd
        - modules/1-predire/s02.qmd
        - modules/1-predire/s03.qmd
    - part: "Module 2 — Assister"
      chapters:
        - modules/2-assister/s04.qmd
        - modules/2-assister/s05.qmd
        - modules/2-assister/s06.qmd
    - part: "Module 3 — Agir"
      chapters:
        - modules/3-agir/s07.qmd
        - modules/3-agir/s08.qmd
        - modules/3-agir/s09.qmd
    - part: "Module 4 — Étendre"
      chapters:
        - modules/4-etendre/s10.qmd
        - modules/4-etendre/s11.qmd
        - modules/4-etendre/s12.qmd
    - part: "Module 5 — Éprouver"
      chapters:
        - modules/5-eprouver/s13.qmd
        - modules/5-eprouver/s14.qmd
        - modules/5-eprouver/s15.qmd
  appendices:
    - evaluation.qmd
    - references.qmd

bibliography: references.bib
nocite: "@*"

format:
  html:
    theme:
      light: cosmo
      dark: [darkly, theme-sombre.scss]
    respect-user-color-scheme: true
    css: styles.css
    toc: true
    toc-title: "Sur cette page"
    code-copy: true
    include-after-body:
      - _includes/coloration.html
      - _includes/theme.html
      - _includes/liens.html
    number-depth: 1
