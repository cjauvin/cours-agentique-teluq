# Compile le site Quarto et le publie sur GitHub Pages à chaque push sur main.
name: Publier le site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # Le rendu n'a pas besoin de PyTorch (groupe « modele ») : on ne l'installe pas.
  UV_NO_DEFAULT_GROUPS: "1"

jobs:
  compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.9.38
      - run: uv sync
      - run: quarto render
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  publier:
    needs: compiler
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
